name: Update MTS Data

on:
  schedule:
    # Runs every day to check if new data are available. If none, it skips.
    - cron: "0 8 * * *"

  # Allows you to trigger this manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest

    # Required so the Action can commit the updated CSV back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas statsmodels groq python-dotenv

      - name: Fetch latest MTS data
        id: fetch
        run: python scripts/fetch_mts_data.py

      - name: Commit and push updated CSV
        if: steps.fetch.outputs.new_data == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mts_data.csv
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update MTS data [$(date +'%Y-%m-%d')]"
          git push

      - name: Analyze latest MTS data
        run: python scripts/analysis.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit and push analysis output    # ← only needed if analysis.py saves files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/        # or whatever folder analysis.py writes to
          git diff --cached --quiet || git commit -m "chore: update analysis output [$(date +'%Y-%m-%d')]"
          git push